# Nginx config for the local Docker stack (docker-compose.yml in Vector_Backend).
# Mounted over /etc/nginx/nginx.conf; the EKS image keeps using ../nginx.conf.
#
# The app is built with BASE_PATH=/vector/, so everything lives under /vector/:
#   /vector/          SPA (falls back to index.html for client-side routes)
#   /vector/api/...   backend, with the /vector/api prefix stripped (same as the Vite dev proxy)
# The shared hub nginx proxies http://localhost/vector/ here, keeping the prefix.

events {}

http {
    include /etc/nginx/mime.types;

    # Docker's embedded DNS, so nginx starts even if the api container is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 50M;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = / {
            return 302 /vector/;
        }

        location = /vector {
            return 301 /vector/;
        }

        location /vector/api/ {
            set $api_upstream http://api:8001;
            rewrite ^/vector/api/(.*)$ /$1 break;
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /vector/ {
            # Same security headers as the EKS image (../nginx.conf)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            try_files $uri $uri/ /vector/index.html;
        }
    }
}
