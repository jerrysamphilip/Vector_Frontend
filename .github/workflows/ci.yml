name: CI

on:
  pull_request:
  push:
    branches: [main, dev, stage]
  workflow_call:  # reused by CICD.yaml so a deploy only happens after the build passes

permissions:
  contents: read

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates: backend docs/CI_GATES.md (all blocking)
      - name: Release identity (package.json == package-lock.json == CHANGELOG.md == manifests)
        run: npm run version:check

      - name: Lint
        run: npm run lint

      # Includes the W-13 help anchors test (src/help/helpAnchors.test.js)
      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      # npm audit --audit-level=high, minus the reviewed, dated entries in ci/npm_audit_ignore.txt
      - name: Dependency audit (high/critical, blocking)
        run: npm run audit:check
