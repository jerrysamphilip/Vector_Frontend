name: CI

on:
  pull_request:
  push:
    branches: [main, dev, stage]
  workflow_call:  # reused by CICD.yaml so a deploy only happens after the build passes

permissions:
  contents: read

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
