apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Pod Security `restricted` (P-1): non-root nginx (nginx-unprivileged, uid 101), no
      # service-account token (nginx never calls the Kubernetes API).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # CI/CD replaces this with the pushed image by digest (P-2), never a tag
          image: <ECR_IMAGE_URI>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          # ✅ Inject namespace automatically
          env:
            - name: APP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            
          envFrom:
            - secretRef:
                name: frontend-env     # same name in each namespace

          volumeMounts:
            - name: env-config
              mountPath: /usr/share/nginx/html/env-config.js
              subPath: env-config.js
            # Read-only root filesystem: nginx's pid file and temp dirs (nginx.conf) live here
            - name: tmp
              mountPath: /tmp
            # nginx's compiled-in cache dir; unused by nginx.conf but kept writable for modules
            - name: nginx-cache
              mountPath: /var/cache/nginx

      volumes:
        - name: env-config
          configMap:
            name: frontend-env-config  # same name in each namespace
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80            # unchanged for the ingress
      targetPort: http    # container port 8080 (non-root nginx)

